name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Validate sample PDF
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qpdf poppler-utils
          dotnet run -c Release --project samples/DotOffice.Samples -- \
            tests/DotOffice.Tests/Assets/NotoSans-Regular.ttf tests/DotOffice.Tests/Assets/gradient.jpg hello.pdf
          qpdf --check hello.pdf
          pdffonts hello.pdf
          pdftotext hello.pdf - | grep -q "Привет, мир!"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: hello-pdf
          path: hello.pdf
